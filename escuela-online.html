<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCI online</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Archivo,Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f7f7;color:#12395c}body{display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid #d6e2e5;flex-wrap:wrap}.logo{width:210px;height:48px;object-fit:contain;object-position:left}.title{font-weight:900;margin-right:auto}.badge{padding:7px 10px;border-radius:999px;background:#e7f8f5;color:#126e65;font-size:.78rem;font-weight:900}.who{font-size:.82rem;color:#6a7b84;font-weight:800}.btn{padding:9px 12px;border:0;border-radius:11px;background:#e7edef;color:#12395c;text-decoration:none;font-weight:850}.status{padding:7px 14px;background:#12395c;color:#fff;text-align:center;font-size:.8rem}.status.bad{background:#9f2942}.frame{display:block;flex:1;width:100%;border:0}.gate{position:fixed;inset:0;display:grid;place-items:center;background:#f3f7f7;z-index:99}.card{width:min(560px,92vw);padding:26px;background:#fff;border:1px solid #d6e2e5;border-radius:22px;box-shadow:0 24px 60px #12395c22}.card h2{margin-top:0}.msg{color:#b3314d;font-weight:800}.hidden{display:none!important}@media(max-width:800px){.logo{width:145px}.who{width:100%}}</style></head><body><header class="top"><img class="logo" src="logo-escuela-maestros.svg?v=20260827" alt="Escuela de Maestros"><div id="title" class="title">Matriz PCI</div><span id="roleBadge" class="badge"></span><span id="who" class="who"></span><a class="btn" href="portal-pci-operativo-v3.html?v=20260827-1">← Volver</a></header><div id="status" class="status">Conectando…</div><iframe id="frame" class="frame" title="Matriz PCI"></iframe><section id="gate" class="gate"><div class="card"><h2>Abriendo PCI online</h2><p>Estamos cargando la versión compartida de esta escuela.</p><div id="gateMsg" class="msg"></div></div></section><script>const API='https://agmebsotbuurbnldxewf.supabase.co/functions/v1/pci-access';const p=new URLSearchParams(location.search);const SCHOOL_ID=Number(p.get('school'));const SCHOOL_NAME=p.get('name')||'Escuela';const frame=document.getElementById('frame');let session={};try{session=JSON.parse(sessionStorage.getItem('pci_access_session')||'{}')}catch{}if(!session.token||!['admin','editor'].includes(session.role)){sessionStorage.removeItem('pci_access_session');location.replace('portal-pci-operativo-v3.html?v=20260827-1')}const role=session.role||'editor';const roleLabel=role==='admin'?'Administrador':'Editor';const identity=session.identity||{};const person=role==='editor'?[identity.first_name,identity.last_name].filter(Boolean).join(' ')||identity.email||'Usuario':'admin';title.textContent=`Matriz PCI · ${SCHOOL_NAME}`;roleBadge.textContent=`Rol: ${roleLabel}`;who.textContent=`${role==='editor'?'Editando como':'Sesión'}: ${person}`;document.title=`${SCHOOL_NAME} · PCI`;async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo completar la operación.');return d}function setStatus(t,bad=false){status.textContent=t;status.className='status'+(bad?' bad':'')}let lastSaved='';let saving=false;async function saveNow(){if(saving)return;const raw=localStorage.getItem('pciAppV2')||'';if(!raw||raw===lastSaved)return;saving=true;setStatus('Guardando online…');try{const state=JSON.parse(raw);if(state.schoolName!==SCHOOL_NAME)state.schoolName=SCHOOL_NAME;await call({action:'save-state',token:session.token,school_id:SCHOOL_ID,data:state});lastSaved=JSON.stringify(state);setStatus(`Guardado online · ${person} · Rol ${roleLabel}`)}catch(err){setStatus('Error al guardar online',true);console.error(err)}finally{saving=false}}async function start(){try{const d=await call({action:'get-state',token:session.token,school_id:SCHOOL_ID});let state=d.data&&typeof d.data==='object'?d.data:{};state.schoolName=SCHOOL_NAME;localStorage.setItem('pciAppV2',JSON.stringify(state));lastSaved=JSON.stringify(state);frame.src=`app.html?v=online-${SCHOOL_ID}-${Date.now()}`;frame.onload=()=>{gate.classList.add('hidden');setStatus(`Conectado · guardado automático · ${person} · Rol ${roleLabel}`)};setInterval(saveNow,900)}catch(err){gateMsg.textContent=err.message;setStatus('No se pudo abrir el PCI',true)}}window.addEventListener('beforeunload',()=>saveNow());start();</script></body></html>
