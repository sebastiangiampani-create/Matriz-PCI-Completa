<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa Curricular Institucional</title><style>:root{--ink:#15374a;--bg:#eef3f4;--line:#d7e2e5;--mint:#83ded3;--muted:#687985}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}header h1{font-size:1rem;margin:0 auto 0 0}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:850;background:#e7edef;color:var(--ink);text-decoration:none;cursor:pointer}.btn.primary{background:var(--ink);color:white}main{padding:14px}.levels{display:grid;grid-template-columns:170px repeat(5,360px);min-width:1970px}.level{padding:8px;text-align:center;background:#dff6f2;border:1px solid var(--line);font-weight:900}.level:first-child{background:#fff}.map-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}.map{display:grid;grid-template-columns:170px repeat(10,180px);min-width:1970px}.cell{min-height:88px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px}.head{background:var(--ink);color:white;font-weight:900;text-align:center;position:sticky;top:0}.area{background:#edf5f6;font-weight:900;position:sticky;left:0}.piece{border:1px solid #bfd0d5;border-radius:10px;padding:8px;background:white;margin:3px 0;box-shadow:0 2px 8px #15374a14}.piece strong{display:block;font-size:.78rem}.piece small{display:block;color:var(--muted);margin-top:4px}.empty{color:var(--muted);font-size:.75rem}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.metric{background:white;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.metric b{font-size:1.2rem} @media(max-width:700px){.levels{grid-template-columns:120px repeat(5,310px);min-width:1670px}.map{grid-template-columns:120px repeat(10,155px);min-width:1670px}}</style></head><body><header><h1>Mapa Curricular Institucional</h1><a class="btn" href="app.html">Volver a la matriz</a><button id="refresh" class="btn">Actualizar</button><button id="print" class="btn primary">Imprimir</button></header><main><div class="summary"><div class="metric"><b id="spaces">0</b><div>espacios</div></div><div class="metric"><b id="hours">0</b><div>horas semanales cargadas</div></div><div class="metric"><b id="contents">0</b><div>asignaciones de contenidos</div></div></div><div class="map-wrap"><div class="levels"><div class="level">Área</div><div class="level">Nivel 1 · C1–C2</div><div class="level">Nivel 2 · C3–C4</div><div class="level">Nivel 3 · C5–C6</div><div class="level">Nivel 4 · C7–C8</div><div class="level">Nivel 5 · C9–C10</div></div><div id="map" class="map"></div></div></main><script>const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const AREAS=['Lengua y Literatura','Matemática','Lenguas Adicionales','Ciencias Sociales','Ciencias Naturales','Artes','Tecnologías','Educación Física'];function load(){let app={areas:{}};try{app=JSON.parse(localStorage.getItem('pciAppV2')||'{"areas":{}}')}catch{};const rows=[];let totalSpaces=0,totalHours=0,totalContents=0;rows.push('<div class="cell head">Área</div>'+Array.from({length:10},(_,i)=>`<div class="cell head">C${i+1}</div>`).join(''));for(const area of AREAS){const groups=app.areas?.[area]?.groups||[];rows.push(`<div class="cell area">${esc(area)}</div>`);for(let term=1;term<=10;term++){const list=groups.filter((g,i)=>{const level=Number(g.level||Math.ceil((Number(g.term)||i+1)/2));const start=Number(g.termStart||g.term||((level*2)-1));const end=Number(g.termEnd||g.term||(area.includes('Lengua')||area==='Matemática'?level*2:start));return term>=start&&term<=end});rows.push(`<div class="cell">${list.length?list.map(g=>{totalSpaces++;totalHours+=Number(g.weeklyHours||g.hours||0);totalContents+=(g.items||[]).length;return `<div class="piece"><strong>${esc(g.name||'Sin nombre')}</strong><small>${esc(g.component==='formacion_orientada'?'Formación Orientada':'Formación General')} · ${Number(g.weeklyHours||g.hours||0)} h · ${(g.items||[]).length} contenidos</small></div>`}).join(''):'<span class="empty">Sin espacios</span>'}</div>`)} }$('map').innerHTML=rows.join('');$('spaces').textContent=totalSpaces;$('hours').textContent=totalHours;$('contents').textContent=totalContents}load();$('refresh').onclick=load;$('print').onclick=()=>print();</script></body></html>
