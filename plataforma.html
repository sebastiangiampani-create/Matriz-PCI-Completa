<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plataforma PCI</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f4f7f8}iframe{width:100%;height:100%;border:0}.v03-toast{position:fixed;right:16px;bottom:16px;z-index:9999;background:#15374a;color:#fff;padding:11px 14px;border-radius:12px;font:700 14px system-ui;box-shadow:0 8px 24px #0003;opacity:0;transform:translateY(8px);transition:.2s}.v03-toast.show{opacity:1;transform:none}</style></head><body><iframe id="pci" src="app.html" title="Plataforma PCI"></iframe><div id="toast" class="v03-toast"></div><script>(()=>{const frame=document.getElementById('pci'),toast=document.getElementById('toast');let observer=null;function notify(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}function install(){const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;const map=d.getElementById('integratedGrid');if(!map){setTimeout(install,300);return}if(map.dataset.v03==='1')return;map.dataset.v03='1';function decorate(){const cells=[...map.querySelectorAll('.integrated-cell')];const areas=['Lengua y Literatura','Matemática','Lenguas Adicionales','Ciencias Sociales','Ciencias Naturales','Artes','Tecnologías','Educación Física'];areas.forEach((area,row)=>{for(let term=1;term<=10;term++){const cell=cells[11+row*11+term];if(!cell)continue;cell.dataset.dropArea=area;cell.dataset.dropTerm=term;if(cell.dataset.v03DropBound==='1')continue;cell.dataset.v03DropBound='1';cell.addEventListener('dragover',e=>{e.preventDefault();cell.style.background='#e5f6ef'});cell.addEventListener('dragleave',()=>cell.style.background='');cell.addEventListener('drop',e=>{e.preventDefault();cell.style.background='';let payload;try{payload=JSON.parse(e.dataTransfer.getData('text/plain'))}catch{return}const group=w.app?.areas?.[payload.area]?.groups?.[payload.index];if(!group)return;if(w.CFG?.[payload.area]?.l==='Nivel'){notify('Las troncales anuales se mueven por nivel desde el inspector.');return}const oldStart=Number(group.termStart||group.term||1),oldEnd=Number(group.termEnd||group.term||oldStart),duration=Math.max(0,oldEnd-oldStart),newStart=term,newEnd=Math.min(10,newStart+duration);group.termStart=newStart;group.termEnd=newEnd;group.level=Math.ceil(newStart/2);group.term=String(newStart);if(typeof w.save==='function')w.save(0);d.getElementById('integratedMapRefresh')?.click();notify(`${group.name||'Espacio'} movido a C${newStart}${newEnd!==newStart?`–C${newEnd}`:''}`)});}});map.querySelectorAll('[data-map-area]').forEach(card=>{if(card.dataset.v03DragBound==='1')return;card.dataset.v03DragBound='1';card.draggable=true;card.title='Arrastrar para mover de cuatrimestre';card.addEventListener('dragstart',e=>{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',JSON.stringify({area:card.dataset.mapArea,index:Number(card.dataset.mapIndex)}));card.style.opacity='.55'});card.addEventListener('dragend',()=>card.style.opacity='')})}decorate();observer=new MutationObserver(decorate);observer.observe(map,{childList:true,subtree:true});notify('Mapa curricular activo.')}frame.addEventListener('load',()=>setTimeout(install,500));setInterval(()=>{try{if(frame.contentDocument?.getElementById('integratedGrid'))install()}catch{}},1000)})();</script><script src="motor-cobertura.js?v=0.7"></script><script src="espacios-formativos-alternativos.js?v=0.8"></script><script src="otros-formatos-pedagogicos.js?v=0.9"></script><script src="tabla-control.js?v=0.9"></script><script src="escuelas-pci.js?v=1.1"></script><script src="exportar-pci.js?v=1.0"></script><script src="mapa-limpio.js?v=1.0"></script></body></html>
