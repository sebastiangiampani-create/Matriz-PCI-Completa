name: Validar editor Técnico aislado
on:
  push:
    branches:
      - release/pci-orientaciones-aditivo-20261111
    paths:
      - ".github/workflows/validar-editor-tecnica.yml"
      - "pci-tecnica-editor.html"
      - "src/tecnica/editor-borrador.mjs"
      - "tests/tecnica-editor-borrador-browser.mjs"
      - "pci-orientaciones.html"
      - "src/orientaciones-online.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-editor-tecnica:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxis de módulos
        run: |
          node --check src/tecnica/editor-borrador.mjs
          node --check src/orientaciones-online.mjs
      - name: Verificar catálogo y compatibilidad curricular
        run: node --test tests/tecnica-priorizados-2026.test.mjs
      - name: Instalar navegador de prueba
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prueba real de editor técnico local y guardado aislado
        run: node tests/tecnica-editor-borrador-browser.mjs
