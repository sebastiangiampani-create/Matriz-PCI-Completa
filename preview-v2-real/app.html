<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12395c">
<title>Mapa de la Oferta · Integración con Matriz PCI</title>
</head>
<body>
<p style="font-family:system-ui;padding:24px">Cargando el Mapa de la Oferta curricular…</p>
<script>
(async()=>{
  // Componentes curriculares de PCI Aprende V2, SIN usuarios ni acceso propios.
  const modulePaths=[
    'src/v19-map.js',
    'src/v20-format-order.js',
    'src/v21-custom-social-ui.js',
    'src/v23-prearm.js',
    'src/v24-social-interactions.js',
    'src/v25-institutional-spaces.js',
    'src/v26-other-formats-print.js',
    'src/v29-fo-rules.js',
    'src/v30-fo-minimum-guard.js',
    'src/v32-phase2-entry-fix.js',
    'src/v38-phase2-workspace.js',
    'src/v47-elective-plans.js',
    'src/v42-homologacion-performance.js',
    'src/v59-phase2-annual-matrix.js',
    'src/v33-articulation-rules.js',
    'src/ui-hide-version-labels.js',
    'src/ui-navigation-consistency.js',
    'src/creative-commons-footer.js',
    'src/v84-content-control-table.js',
    'src/v91-coverage-core.js',
    'src/v91-plans-coverage.js',
    'src/v93-curricular-coverage-dashboard.js',
    'src/v108-pci-document-editor.js',
    'src/v112-remove-obsolete-map-notice.js',
    'src/v119-responsive-legibility.js',
    'src/matriz-bridge-preview.js'
  ];
  const fetchText=async url=>{
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)throw new Error(`No se pudo cargar ${url}.`);
    return response.text();
  };
  const inline=source=>'<script>'+String(source).replace(/<\/script/gi,'<\\/script')+'</scr'+'ipt>\n';

  try{
    const [htmlRaw,phase2Source,foAtomicSource,...moduleSources]=await Promise.all([
      fetchText('app-core.html'),
      fetchText('src/v47-phase2-matrix.js'),
      fetchText('src/v47-fo-content-atomicizer.js'),
      ...modulePaths.map(fetchText)
    ]);

    if(!phase2Source.includes('function areaPool')||!phase2Source.includes('id="v28level"')||!phase2Source.includes('loadCurriculum')||!phase2Source.includes('window.PCIPhase2V28=')){
      throw new Error('No se pudo cargar la versión curricular V96 de Fase 2.');
    }

    let html=htmlRaw;
    // En la demo institucional cada PCI tiene su propio almacenamiento.
    // Sin pci en la URL, la aplicación V2 original permanece sin modificar.
    const query=new URLSearchParams(location.search);
    if(query.has('pci')){
      const pciId=String(query.get('pci')||'');
      const orientation=String(query.get('orientation')||'');
      const school=String(query.get('school')||'').slice(0,140);
      const validOrientations=['Ciencias Naturales','Matemática y Física','Energía y Sustentabilidad',
        'Economía y Administración','Educación Física','Comunicación','Literatura','Turismo','Lenguas',
        'Informática','Educación','Ciencias Sociales y Humanidades','Arte - Artes Visuales',
        'Arte - Música','Arte - Teatro','Agro y Ambiente'];
      if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(pciId)
        ||!validOrientations.includes(orientation)||school.length<3)
        throw new Error('Los datos de la institución o del PCI de prueba no son válidos.');
      const originalStorage="const STORAGE='pci-matriz-fg-v2-original-preview-20261009';";
      const originalState="let DATA,state={school:'Escuela Muestra',selected:['Economía y Administración'],active:'Economía y Administración',maps:{}};let picked=null,mapOnly=false;";
      if(!html.includes(originalStorage)||!html.includes(originalState))
        throw new Error('La versión original del PCI V2 cambió; no se permite iniciar sin aislar el guardado.');
      const scopedStorage='pci-matriz-fg-v2-original-preview-20261009:pci:'+pciId;
      html=html.replace(originalStorage,'const STORAGE='+JSON.stringify(scopedStorage)+';');
      html=html.replace(originalState,
        'let DATA,state='+JSON.stringify({school,selected:[orientation],active:orientation,maps:{}})+';let picked=null,mapOnly=false;');
    }
    const closeScript='</scr'+'ipt>';
    html=html.replace('\ninit();\n'+closeScript,'\nwindow.__pciBaseInit=init;\n'+closeScript);

    const pivot=modulePaths.indexOf('src/v29-fo-rules.js');
    if(pivot<0)throw new Error('Faltan las reglas curriculares de Formación Orientada.');
    const beforePhase2=moduleSources.slice(0,pivot).map(inline).join('');
    const afterPhase2=moduleSources.slice(pivot).map(inline).join('');
    html=html.replace('</body>',
      beforePhase2+
      inline(foAtomicSource)+
      inline(phase2Source)+
      afterPhase2+
      '<script>(async()=>{if(window.__pciBaseInit)await window.__pciBaseInit();window.dispatchEvent(new Event("pci-app-ready"));})();</scr'+'ipt>\n'+
      '</body>'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<main style="font-family:system-ui;padding:24px"><strong>Error al cargar la aplicación.</strong><p>'+String(error.message||error)+'</p></main>';
  }
})();
</script>
</body>
</html>
