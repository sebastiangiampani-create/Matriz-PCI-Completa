<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCI Offline</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,"Segoe UI",system-ui,sans-serif;background:#f4f7f8;color:#12395c}body{display:flex;flex-direction:column}.bar{position:fixed;z-index:50;right:13px;bottom:13px;display:flex;align-items:center;gap:9px;max-width:min(620px,94vw);padding:7px 8px 7px 13px;background:#fff;border:1px solid #d7e2e8;border-radius:999px;box-shadow:0 7px 22px #12395c22}.status{font-size:.75rem;font-weight:850;color:#58707e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status.bad{color:#a92b45}.btn{padding:6px 11px;border:0;border-radius:999px;background:#e8eef1;color:#12395c;text-decoration:none;font-weight:850;font-size:.73rem}.frame{width:100%;flex:1;border:0;display:block}.gate{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#f4f7f8}.card{width:min(520px,92vw);padding:25px;background:#fff;border:1px solid #d7e2e8;border-radius:20px;box-shadow:0 22px 55px #12395c22}.card h2{margin-top:0}.msg{color:#a92b45;font-weight:800}.hidden{display:none!important}@media(max-width:700px){.bar{left:9px;right:9px;bottom:9px;max-width:none}}</style></head><body>
<iframe id="frame" class="frame" title="Matriz PCI Offline"></iframe><div class="bar"><span id="status" class="status">Abriendo copia local…</span><a class="btn" href="/index.html">← Volver</a></div><div id="gate" class="gate"><div class="card"><h2>Abriendo PCI offline</h2><p>Los cambios se guardan únicamente en esta computadora.</p><div id="gateMsg" class="msg"></div></div></div>
<script>
const MUT={'X-Requested-With':'MatrizPCI-Offline','Content-Type':'application/json'},frame=document.getElementById('frame'),statusEl=document.getElementById('status');let sess={};try{sess=JSON.parse(sessionStorage.getItem('pci_offline_session')||'{}')}catch{}if(!sess.token){location.replace('/index.html')}
let lastSaved='',saving=false,timer=null,STORAGE_KEY='',APP_URL='';function setStatus(t,bad=false){statusEl.textContent=t;statusEl.className='status'+(bad?' bad':'')}
async function getState(){const r=await fetch('/api/state?token='+encodeURIComponent(sess.token),{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo abrir la copia local.');return d}
function initialState(raw,model,name){let state=raw&&typeof raw==='object'?raw:{};if(model==='tecnica'){if(state.profile!=='tecnica')state={schemaVersion:2,profile:'tecnica',schoolName:name,areas:{},current:null};else state.schoolName=name}else{if(state.profile==='tecnica')state={schoolName:name,areas:{},current:null};else state.schoolName=name}return state}
async function saveNow(){if(saving||!STORAGE_KEY)return;const raw=localStorage.getItem(STORAGE_KEY)||'';if(!raw||raw===lastSaved)return;saving=true;setStatus('Guardando en esta PC…');try{const data=JSON.parse(raw);const r=await fetch('/api/state',{method:'POST',headers:MUT,body:JSON.stringify({token:sess.token,data})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo guardar localmente.');lastSaved=raw;setStatus('Guardado offline · '+(sess.name||'PCI'))}catch(err){setStatus('Error de guardado local: '+err.message,true)}finally{saving=false}}
(async()=>{try{const d=await getState();sess.name=d.name;sessionStorage.setItem('pci_offline_session',JSON.stringify(sess));const model=d.model==='tecnica'?'tecnica':'comun';STORAGE_KEY=model==='tecnica'?'pciTecnicaV2':'pciAppV2';APP_URL=model==='tecnica'?'/tecnica/app.html':'/app.html';const state=initialState(d.data,model,d.name);localStorage.setItem(STORAGE_KEY,JSON.stringify(state));lastSaved=JSON.stringify(state);frame.src=APP_URL+'?offline=1&v='+Date.now();frame.onload=()=>{document.getElementById('gate').classList.add('hidden');setStatus('Modo offline · guardado automático · '+d.name);timer=setInterval(saveNow,900)}}catch(err){document.getElementById('gateMsg').textContent=err.message;setStatus('No se pudo abrir el PCI offline',true)}})();
window.addEventListener('beforeunload',()=>{if(timer)clearInterval(timer);saveNow()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow()});
</script></body></html>
