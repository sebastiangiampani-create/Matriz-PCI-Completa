name: Reparar catalogo de escuelas PCI (manual)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Aplicar la correccion en Supabase despues de validar (false = solo preparar)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: pci-access-produccion
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: agmebsotbuurbnldxewf
    steps:
      - name: Descargar codigo versionado
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verificar parche con tests locales
        run: node --test tests/pci-catalog-patch.test.js

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Preparar sin sobrescribir la funcion remota
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'Falta configurar el secret SUPABASE_ACCESS_TOKEN en GitHub Actions.'
            exit 1
          fi
          supabase functions download pci-access --project-ref "$PROJECT_REF" --use-api
          test -s supabase/functions/pci-access/index.ts
          cp supabase/functions/pci-access/index.ts "$RUNNER_TEMP/pci-access-before-fix.ts"
          node scripts/patch-pci-catalog.mjs "$RUNNER_TEMP/pci-access-before-fix.ts" "$RUNNER_TEMP/pci-access-after-fix.ts"
          cp "$RUNNER_TEMP/pci-access-after-fix.ts" supabase/functions/pci-access/index.ts
          if grep -q 'fetch(CATALOG_URL' supabase/functions/pci-access/index.ts; then
            echo 'Validacion fallida: todavia hay dependencia del catalogo externo.'
            exit 1
          fi
          echo 'Parche generado. No se modificaron registros de escuelas.'

      - name: Desplegar solo con autorizacion manual
        if: ${{ inputs.deploy }}
        run: supabase functions deploy pci-access --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      - name: Consultar estado de la funcion
        if: ${{ inputs.deploy }}
        run: supabase functions list --project-ref "$PROJECT_REF"
