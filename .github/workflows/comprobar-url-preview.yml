name: Comprobar vista auténtica PCI V2 online
on:
  push:
    branches:
      - 'preview/orientaciones-online-demo-20261111'
    paths:
      - '.github/workflows/comprobar-url-preview.yml'
      - 'pci-orientaciones-demo.html'
      - 'preview-v2-real/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verificar pagina original publica y sus recursos
        run: |
          ROOT="https://raw.githack.com/sebastiangiampani-create/Matriz-PCI-Completa/preview/orientaciones-online-demo-20261111"
          curl --retry 3 --max-time 30 -fsSL "$ROOT/preview-v2-real/app.html" -o app.html
          curl --retry 3 --max-time 30 -fsSL "$ROOT/preview-v2-real/app-core.html" -o app-core.html
          curl --retry 3 --max-time 30 -fsSL "$ROOT/preview-v2-real/src/v47-phase2-matrix.js" -o v47.js
          curl --retry 3 --max-time 30 -fsSL "$ROOT/preview-v2-real/data/materias-v2.json" -o materias.json
          for f in app.html app-core.html v47.js materias.json; do echo "Descarga OK: $f $(wc -c < "$f") bytes"; done
          grep -q 'Mapa de la Oferta' app.html || (echo 'Error: título app' && exit 1)
          grep -q 'matrizOrientationSelect' app-core.html || (echo 'Error: selector orientación' && exit 1)
          grep -q 'id="matrix"' app-core.html || (echo 'Error: matriz original' && exit 1)
          grep -q 'v47-phase2-matrix.js' app.html || (echo 'Error: módulo V2' && exit 1)
          grep -q 'matriz' app-core.html || (echo 'Error: contenido V2' && exit 1)
          curl --retry 3 --max-time 30 -fsSL "$ROOT/preview-v2-real/institucion.html" -o institucion.html
          curl --retry 3 --max-time 30 -fsSL "$ROOT/preview-v2-real/src/institucion-pci-demo.js" -o institucion.js
          grep -q 'Cantidad de orientaciones' institucion.html
          grep -q 'Cantidad de turnos' institucion.html
          grep -q 'PCI independientes de la escuela' institucion.html
          grep -q 'Abrir PCI y mapa C1' institucion.js
          echo "OK: la rama publica entrega seleccion de orientaciones, turnos y mapa autentico V2."
