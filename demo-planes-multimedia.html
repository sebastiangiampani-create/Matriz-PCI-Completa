<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Demo · Planes bimestrales multimedia</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f7f7}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
  <iframe id="demoFrame" src="app.html?v=planes-multimedia-20260814" title="Demo de planes bimestrales multimedia"></iframe>
  <script>
    const frame=document.getElementById('demoFrame');
    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc||doc.querySelector('script[data-planes-media-demo]'))return;
      const script=doc.createElement('script');
      script.type='module';
      script.src='planes-media-print-demo.js?v=20260814-2';
      script.dataset.planesMediaDemo='1';
      doc.body.appendChild(script);
    });
  </script>
</body>
