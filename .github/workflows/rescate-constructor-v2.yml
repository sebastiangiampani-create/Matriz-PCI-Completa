name: Rescate constructor PCI V2 - reglas y mapa
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/constructor-v2-ui.mjs'
      - 'src/orientaciones-online.mjs'
      - 'src/ba15/**'
      - 'src/tecnica/**'
      - 'src/pci-flujo-fases.mjs'
      - 'tests/flujo-constructor-tres-modalidades.test.mjs'
      - 'tests/multipci-portal-browser.mjs'
      - 'tests/ba15-constructor.test.mjs'
      - 'tests/tecnica-integrada-v2.test.mjs'
      - 'src/integracion-curricular/constructor-mapa-unificado.mjs'
      - 'tests/constructor-mapa-unificado.test.mjs'
      - 'pci-orientaciones.css'
      - '.github/workflows/rescate-constructor-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-reglas-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis de constructor y motor
        run: |
          node --check src/constructor-v2-ui.mjs
          node --check src/integracion-curricular/constructor-mapa-unificado.mjs
          node --check tests/constructor-mapa-unificado.test.mjs
          node --check tests/rescate-constructor-v2-integracion.test.mjs
          node --check src/normativa/adaptador-mapa-media-20261117.mjs
          node --check src/pci-fase-desarrollo-fg.mjs
          node --check src/orientaciones-online.mjs
          node --check src/ba15/constructor-ui.mjs
          node --check src/tecnica/interfaz-integrada-v2.mjs
          node --check src/tecnica/espacio-trabajo-v2.mjs
          node --check tests/flujo-constructor-tres-modalidades.test.mjs
      - name: Reglas PCI V2 - obligatoriedad, duplicados, replica y resguardo
        run: node --test tests/constructor-mapa-unificado.test.mjs tests/rescate-constructor-v2-integracion.test.mjs tests/pci-fase-desarrollo-fg.test.mjs tests/adaptador-media-final-20261117.test.mjs tests/flujo-constructor-tres-modalidades.test.mjs tests/ba15-constructor.test.mjs tests/tecnica-integrada-v2.test.mjs
      - name: Conservar originales escolares fuera del diff
        run: |
          git fetch origin main
          git diff --quiet origin/main...HEAD -- app.js app.html app.css pci-model.js escuela-online.html tecnica/app.html supabase/functions/pci-multipci/index.ts

  navegador-constructor-v2:
    runs-on: ubuntu-24.04
    needs: validar-reglas-v2
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Chrome para la revisión de V2
        run: |
          npm install --no-save playwright@1.55.0
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Probar constructor real, historial, arrastre y vuelta de fases
        run: |
          mkdir -p test-artifacts/multipci-portal
          node tests/multipci-portal-browser.mjs
      - name: Guardar las capturas sin publicar en main
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescate-constructor-v2-visual
          path: test-artifacts/multipci-portal
          if-no-files-found: ignore
          retention-days: 7
