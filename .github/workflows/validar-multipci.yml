name: Validar alta de escuelas y múltiples PCI - aislado

on:
  pull_request:
    branches:
      - main
    paths:
      - preview-multipci.html
      - pci-orientaciones.html
      - pci-orientaciones.css
      - src/orientaciones-online.mjs
      - src/orientaciones-release-core.mjs
      - tests/orientaciones-release.test.mjs
      - tests/orientaciones-release-browser.mjs
      - tests/edge-package.test.mjs
      - src/multipci/**
      - supabase/functions/pci-access/**
      - supabase/config.toml
      - migration/multipci/**
      - tests/multipci/**
      - .github/workflows/validar-multipci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validacion-aislada:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: demo-only-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: demo-only-ci
      PGDATABASE: postgres
    steps:
      - name: Descargar rama de prueba
        uses: actions/checkout@v4
      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis y aislamiento de la interfaz
        run: |
          node --check src/orientaciones-online.mjs
          node --check src/orientaciones-release-core.mjs
          node --test tests/multipci/*.test.mjs tests/orientaciones-release.test.mjs tests/edge-package.test.mjs
      - name: Probar el módulo online en Chromium con Supabase simulado
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/orientaciones-release-browser.mjs
      - name: Preparar estructura mínima ficticia
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE TABLE public.pci_proposals (
            school_id integer PRIMARY KEY,
            data jsonb NOT NULL,
            edit_code text,
            primary_code text,
            updated_at timestamptz NOT NULL DEFAULT clock_timestamp()
          );
          SQL
      - name: Validar SQL aditivo en PostgreSQL 17 aislado
        run: |
          psql -v ON_ERROR_STOP=1 -f migration/multipci/001_additive_school_pcis.sql
          psql -v ON_ERROR_STOP=1 -f tests/multipci/contrato-postgres.sql
