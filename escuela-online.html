<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>PCI online</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Archivo,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f7f7;color:#12395c}body{display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid #d6e2e5;flex-wrap:wrap}.logo{width:210px;height:48px;object-fit:contain;object-position:left}.title{font-weight:900;margin-right:auto}.badge{padding:7px 10px;border-radius:999px;background:#e7f8f5;color:#126e65;font-size:.78rem;font-weight:900}.who{font-size:.82rem;color:#6a7b84;font-weight:800}.btn{padding:9px 12px;border:0;border-radius:11px;background:#e7edef;color:#12395c;text-decoration:none;font-weight:850}.status{padding:7px 14px;background:#12395c;color:#fff;text-align:center;font-size:.8rem}.status.readonly{background:#6a5a1d}.status.bad{background:#9f2942}.frame{display:block;flex:1;width:100%;border:0}.gate{position:fixed;inset:0;display:grid;place-items:center;background:#f3f7f7;z-index:99}.card{width:min(560px,92vw);padding:26px;background:#fff;border:1px solid #d6e2e5;border-radius:22px;box-shadow:0 24px 60px #12395c22}.card h2{margin-top:0}.msg{color:#b3314d;font-weight:800}.hidden{display:none!important}@media(max-width:800px){.logo{width:145px}.who{width:100%}}</style></head><body>
<header class="top"><img class="logo" src="logo-escuela-maestros.svg?v=20260827" alt="Escuela de Maestros"><div id="title" class="title">Matriz PCI</div><span id="modelBadge" class="badge"></span><span id="roleBadge" class="badge"></span><span id="who" class="who"></span><a id="backLink" class="btn" href="index.html?v=20260828-monitor">← Volver</a></header><div id="status" class="status">Conectando…</div><iframe id="frame" class="frame" title="Matriz PCI"></iframe><section id="gate" class="gate"><div class="card"><h2>Abriendo PCI online</h2><p id="gateText">Estamos cargando la versión compartida de esta escuela.</p><div id="gateMsg" class="msg"></div></div></section>
<script>
const API='https://agmebsotbuurbnldxewf.supabase.co/functions/v1/pci-access';const p=new URLSearchParams(location.search);const SCHOOL_ID=Number(p.get('school'));const SCHOOL_NAME=p.get('name')||'Escuela';const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();const isTechnicalName=name=>{const n=norm(name);return n.includes('tecnica')||n.includes('tecnicas')||n.includes('politecnica')||/(^|\s)et(\s|$)/.test(n)||/(^|\s)tec(\s|$)/.test(n)};const TECHNICAL=p.get('model')==='tecnica'||isTechnicalName(SCHOOL_NAME);const STORAGE_KEY=TECHNICAL?'pciTecnicaV2':'pciAppV2';const APP_URL=TECHNICAL?'tecnica/app.html':'app.html';const MODEL_LABEL=TECHNICAL?'Técnica':'Común';const frame=document.getElementById('frame');let session={};try{session=JSON.parse(sessionStorage.getItem('pci_access_session')||sessionStorage.getItem('pci_admin_monitor_session')||sessionStorage.getItem('pci_school_admin_session')||'{}')}catch{}if(!session.token||!['admin','editor','school_admin'].includes(session.role)){sessionStorage.removeItem('pci_access_session');location.replace('index.html?v=20260828-monitor')}
if(session.role!=='admin'&&Number(session.school_id)!==SCHOOL_ID){location.replace('index.html?v=20260828-monitor')}
const role=session.role||'editor';const READ_ONLY=role==='school_admin';const roleLabel=role==='admin'?'Administrador':role==='school_admin'?'Referente institucional':'Editor';const identity=session.identity||{};const person=role==='editor'?[identity.first_name,identity.last_name].filter(Boolean).join(' ')||identity.email||'Usuario':role==='school_admin'?'Referente institucional':'admin';document.getElementById('title').textContent=`Matriz PCI ${MODEL_LABEL} · ${SCHOOL_NAME}`;document.getElementById('modelBadge').textContent=`Modelo: ${MODEL_LABEL}`;document.getElementById('roleBadge').textContent=`Rol: ${roleLabel}`;document.getElementById('who').textContent=READ_ONLY?'Consulta en modo sólo lectura':`${role==='editor'?'Editando como':'Sesión'}: ${person}`;document.title=`${SCHOOL_NAME} · PCI ${MODEL_LABEL}`;document.getElementById('gateText').textContent=READ_ONLY?`Estamos cargando la Matriz ${MODEL_LABEL} de esta escuela en modo sólo lectura.`:`Estamos cargando la Matriz ${MODEL_LABEL} compartida de esta escuela.`;if(READ_ONLY)document.getElementById('backLink').href='panel-escuela.html';
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo completar la operación.');return d}function setStatus(t,bad=false,readOnly=false){const el=document.getElementById('status');el.textContent=t;el.className='status'+(bad?' bad':readOnly?' readonly':'')}let lastSaved='';let saving=false;
function initialState(raw){let state=raw&&typeof raw==='object'?raw:{};if(TECHNICAL){if(state.profile!=='tecnica'){state={schemaVersion:2,profile:'tecnica',schoolName:SCHOOL_NAME,areas:{},current:null};}else state.schoolName=SCHOOL_NAME;}else{if(state.profile==='tecnica')state={schoolName:SCHOOL_NAME,areas:{},current:null};else state.schoolName=SCHOOL_NAME;}return state;}
function applyReadOnly(){if(!READ_ONLY)return;try{const doc=frame.contentDocument;if(!doc)return;const style=doc.createElement('style');style.textContent=`input,textarea,select{pointer-events:none!important;user-select:none!important;background:#f3f6f7!important}button.remove-content,[data-add-custom],#addOther,#moveSelected,#matrixMove,[data-delete-other],.custom-add-row{display:none!important}.group-card input,.group-card textarea,.group-card select{opacity:.82!important}`;doc.head.appendChild(style);doc.querySelectorAll('input,textarea,select').forEach(el=>{el.setAttribute('readonly','readonly');el.setAttribute('tabindex','-1')});doc.querySelectorAll('[contenteditable="true"]').forEach(el=>el.setAttribute('contenteditable','false'));}catch(e){console.warn('No se pudo aplicar modo lectura',e)}}
async function saveNow(){if(READ_ONLY||saving)return;const raw=localStorage.getItem(STORAGE_KEY)||'';if(!raw||raw===lastSaved)return;saving=true;setStatus('Guardando online…');try{const state=JSON.parse(raw);state.schoolName=SCHOOL_NAME;if(TECHNICAL)state.profile='tecnica';await call({action:'save-state',token:session.token,school_id:SCHOOL_ID,data:state});lastSaved=JSON.stringify(state);setStatus(`Guardado online · ${person} · ${MODEL_LABEL}`)}catch(err){setStatus('Error al guardar online',true);console.error(err)}finally{saving=false}}
async function start(){try{const d=await call({action:'get-state',token:session.token,school_id:SCHOOL_ID});const state=initialState(d.data);localStorage.setItem(STORAGE_KEY,JSON.stringify(state));frame.src=`${APP_URL}?v=online-${MODEL_LABEL.toLowerCase()}-${SCHOOL_ID}-${Date.now()}`;frame.onload=()=>{setTimeout(()=>{lastSaved=localStorage.getItem(STORAGE_KEY)||JSON.stringify(state);applyReadOnly();document.getElementById('gate').classList.add('hidden');setStatus(READ_ONLY?`Sólo lectura · ${SCHOOL_NAME} · Matriz ${MODEL_LABEL}`:`Conectado · guardado automático · ${person} · Matriz ${MODEL_LABEL}`,false,READ_ONLY)},300)};if(!READ_ONLY)setInterval(saveNow,900)}catch(err){document.getElementById('gateMsg').textContent=err.message;setStatus('No se pudo abrir el PCI',true)}}window.addEventListener('beforeunload',()=>saveNow());window.addEventListener('online',()=>saveNow());window.addEventListener('offline',()=>setStatus(READ_ONLY?'Sólo lectura · sin conexión':'Sin conexión · cambios locales',!READ_ONLY,READ_ONLY));start();
</script></body></html>
