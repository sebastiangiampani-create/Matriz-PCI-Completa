name: Reconstrucción geométrica de priorizados Técnica
on:
  push:
    branches: [fix/rescate-constructor-v2-reglas-20261119]
    paths:
      - 'scripts/inspeccionar-pdf-tecnica.py'
      - 'scripts/reconstruir-base-tecnica.py'
      - 'scripts/test-base-tecnica.py'
      - '.github/workflows/reconstruir-base-tecnica.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnosticar-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar PyMuPDF
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Diagnóstico geométrico de Prácticas Profesionalizantes
        run: |
          python scripts/inspeccionar-pdf-tecnica.py | awk '/PAGE practicas/{mostrar=1} /PAGE pagina_vacia/{mostrar=0} mostrar{print}'
      - name: Comprobar materias que comparten página y PP en Computación
        run: |
          python scripts/reconstruir-base-tecnica.py --only computacion --output test-artifacts/tecnica/muestra
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('test-artifacts/tecnica/muestra/computacion.json').read_text())
          for name,p in [('Música',14),('Diseño',14),('Prácticas Profesionalizantes',97)]:
              rows=[x for x in d['contenidos'] if x['subject']==name and x['page']==p]
              print('MUESTRA_PDF',name,p,len(rows),[(v['axis'],v['text'][:120]) for v in rows[:5]],flush=True)
          PY
      - name: Atomizar y consolidar las 26 especialidades desde PDF oficiales
        run: |
          python scripts/reconstruir-base-tecnica.py --jobs 5
      - name: Verificar coherencia de los contenidos y materias recuperadas
        run: python scripts/test-base-tecnica.py
      - name: Instalar catálogo normalizado en la rama PR47 (nunca main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/rescate-constructor-v2-reglas-20261119'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tecnica/base-curricular/*.json
          if git diff --cached --quiet; then
            echo "Base curricular ya actualizada."
          else
            git commit -m "data(tecnica): base atomizada de 26 PDF oficiales [skip ci]"
            git fetch origin fix/rescate-constructor-v2-reglas-20261119
            git rebase origin/fix/rescate-constructor-v2-reglas-20261119
            git push origin HEAD:fix/rescate-constructor-v2-reglas-20261119
          fi
      - name: Conservar base curricular reconstruida e incidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-tecnica-26-especialidades
          path: data/tecnica/base-curricular
          if-no-files-found: warn
          retention-days: 14
