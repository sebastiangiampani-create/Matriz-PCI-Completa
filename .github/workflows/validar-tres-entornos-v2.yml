name: Tres entornos V2 separados - Media Tecnica BA15
on:
  push:
    branches:
      - feature/tres-entornos-v2-paralelos-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tres-apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar la integridad exacta del V2 original
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object vendor/pci-sec-aprende-v2/app-core.html)" = a318ca1730857d0394113f5f079387183f348048
          test "$(git hash-object vendor/pci-sec-aprende-v2/src/v19-map.js)" = e1a72cc683e875a414c631c9727ce1a725378df6
          node --check experiencias-v2/seleccion.mjs
          node --check tests/tres-motores-v2-independientes-browser.mjs
      - name: Preparar navegador
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Comprobar entradas reales Media, Tecnica y BA15
        run: node tests/tres-motores-v2-independientes-browser.mjs
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tres-motores-v2-prueba
          path: test-artifacts/tres-entornos-v2
          retention-days: 7
