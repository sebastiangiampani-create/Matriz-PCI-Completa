name: Validar integración multi-PCI sin sobrescrituras
on:
  pull_request:
    branches: [main]
  push:
    branches: [release/multipci-aditivo-seguro-20261118]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motor-curricular-y-resguardo:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Proteger editores históricos y validar rutas desde los paneles de acceso
        run: |
          git fetch origin main
          git diff --name-status origin/main...HEAD | awk '
            $1 == "A" { next }
            $1 == "M" && ($2 == "index.html" ||
                          $2 == "escuela-online.html" ||
                          $2 == "supabase/functions/pci-multipci/index.ts" ||
                          $2 == "src/aplicacion-v2/cargador.mjs" ||
                          $2 == "src/aplicacion-v2/datos-escuela.mjs" ||
                          $2 == "src/aplicacion-v2/entrada.mjs" ||
                          $2 == "src/aplicacion-v2/runtime-v2.js" ||
                          $2 == "tests/aplicacion-v2-documentos.test.mjs" ||
                          $2 == "tests/aplicacion-v2-admin-browser.mjs" ||
                          $2 == "tests/pci-multipci-v2-contract.test.mjs" ||
                          $2 == ".github/workflows/rescate-constructor-v2.yml" ||
                          $2 == "src/admin-escuelas-panel.mjs" ||
                          $2 == "panel-general.html" ||
                          $2 == "panel-escuela.html" ||
                          $2 == "panel-accesos.html" ||
                          $2 == "panel-usuarios.html" ||
                          $2 == "pci-orientaciones.html" ||
                          $2 == "pci-orientaciones.css" ||
                          $2 == "src/orientaciones-online.mjs" ||
                          $2 == "src/ba15/constructor-ui.mjs" ||
                          $2 == "src/ba15/constructor.mjs" ||
                          $2 == "src/ba15/priorizados-base.mjs" ||
                          $2 == "src/constructor-v2-ui.mjs" ||
                          $2 == "src/integracion-curricular/constructor-mapa-unificado.mjs" ||
                          $2 == "src/normativa/adaptador-mapa-media-20261117.mjs" ||
                          $2 == "src/normativa/composicion-pci-20261117.mjs" ||
                          $2 == "src/pci-fase-desarrollo-fg.mjs" ||
                          $2 == "src/pci-router.mjs" ||
                          $2 == "src/tecnica/espacio-trabajo-v2.mjs" ||
                          $2 == "tests/constructor-mapa-unificado.test.mjs" ||
                          $2 == "tests/pci-model.test.js" ||
                          $2 == "tests/ba15-priorizados-base.test.mjs" ||
                $2 == "tests/ba15-constructor.test.mjs" ||
                          $2 == "tests/pci-nueva-escuela-browser.mjs" ||
                          $2 == "tests/vinculos-historicos-browser.mjs" ||
                          $2 == "tests/browser-smoke-v2.mjs" ||
                          $2 == "tests/pci-flujo-fases.test.mjs" ||
                          $2 == ".github/workflows/validar-ajustes.yml" ||
                          $2 == "curriculum-ui.js" ||
                $2 == "arts-multiple-workshops.js" ||
                          $2 == "src/tecnica/interfaz-integrada-v2.mjs" ||
                          $2 == "src/v2-familia/catalogos-modalidad.mjs" ||
                          $2 == "tests/v2-familia-catalogos-todos.test.mjs" ||
                          $2 == "src/v2-familia/v19-mapa-modalidad.js" ||
                          $2 == "tests/v2-ba15-norma-browser.mjs" ||
                          $2 == "tests/v2-familia-modalidades-browser.mjs" ||
                          $2 ~ /^tests\/multipci-portal-browser\.mjs$/ ||
                          $2 == ".github/workflows/validar-multipci-aditivo-seguro.yml" ||
                          $2 == ".github/workflows/verificar-publicacion-multipci.yml") { next }
            { print "CAMBIO FUERA DEL MODULO NUEVO:", $0; bad=1 }
            END { exit bad }'
          git diff --quiet origin/main...HEAD -- app.html app.css app.js tecnica/app.html
          grep -q 'function schoolDestination' index.html
          grep -q "get('continuar')==='pci'" index.html
      - name: Verificar sintaxis de los módulos nuevos
        run: |
          node --check curriculum-ui.js
          node --check src/orientaciones-online.mjs
          node --check src/vinculos-historicos.mjs
          node --check src/vinculos-historicos-ui.mjs
          node --check tests/vinculos-historicos.test.mjs
          node --check tests/vinculos-historicos-browser.mjs
          node --check src/pci-router.mjs
          node --check src/admin-escuelas-panel.mjs
          node --check tests/pci-navegacion-admin.test.mjs
          node --check src/pci-flujo-fases.mjs
          node --check src/pci-fase-desarrollo-fg.mjs
          node --check tests/pci-fase-desarrollo-fg.test.mjs
          node --check tests/pci-flujo-fases.test.mjs
          node --check src/pci-desarrollo-resumen.mjs
          node --check tests/pci-desarrollo-resumen.test.mjs
          node --check tests/pci-sociales-opciones-v2.test.mjs
          node --check src/constructor-v2-ui.mjs
          node --check src/integracion-curricular/constructor-mapa-unificado.mjs
          node --check tests/constructor-mapa-unificado.test.mjs
          node --check src/orientaciones-release-core.mjs
          node --check src/pci-turnos-organizacion.mjs
          node --check src/ba15/constructor-ui.mjs
          node --check src/ba15/constructor.mjs
          node --check src/ba15/priorizados-base.mjs
          node --check tests/ba15-priorizados-base.test.mjs
          node --check src/tecnica/interfaz-integrada-v2.mjs
          node --check src/tecnica/espacio-trabajo-v2.mjs
          node --check tests/multipci-portal-browser.mjs
          node --check tests/pci-nueva-escuela-browser.mjs
          grep -q 'function canDeclareOrientations' supabase/functions/pci-multipci/index.ts
          grep -q 'if(!canDeclareOrientations(s))' supabase/functions/pci-multipci/index.ts
          grep -q 'authorizedPci(s,body,saving)' supabase/functions/pci-multipci/index.ts
      - name: Verificar contrato remoto y autorizaciones de la unidad V2
        run: node --test tests/pci-multipci-v2-contract.test.mjs tests/aplicacion-v2-documentos.test.mjs tests/accesos-tres-claves.test.mjs tests/panel-general-oferta-actual.test.mjs
      - name: Probar currícula y guardado aislado por PCI
        run: |
          node --test tests/vinculos-historicos.test.mjs tests/pci-navegacion-admin.test.mjs tests/pci-fase-desarrollo-fg.test.mjs tests/pci-flujo-fases.test.mjs tests/constructor-mapa-unificado.test.mjs tests/pci-desarrollo-resumen.test.mjs tests/pci-sociales-opciones-v2.test.mjs tests/ba15-reglas.test.mjs tests/ba15-constructor.test.mjs tests/turnos-modalidades.test.mjs tests/orientaciones-release.test.mjs tests/tecnica-integrada-v2.test.mjs tests/adaptador-media-final-20261117.test.mjs tests/integracion-catalogos.test.js tests/ba15-priorizados-base.test.mjs
  navegador-multi-pci:
    runs-on: ubuntu-24.04
    needs: motor-curricular-y-resguardo
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador de prueba
        run: |
          npm install --no-save playwright@1.55.0
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Comprobar las tres modalidades en la aplicación nativa (sin iframe ni escrituras reales)
        run: |
          mkdir -p test-artifacts/multipci-portal
          node tests/aplicacion-v2-browser.mjs
          node tests/aplicacion-v2-admin-browser.mjs
          node tests/vinculos-historicos-browser.mjs
      - name: Conservar captura del recorrido
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vista-real-pci-multipci
          path: test-artifacts/multipci-portal/
          if-no-files-found: ignore
          retention-days: 7
