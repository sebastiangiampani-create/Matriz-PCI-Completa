name: Reconstrucción geométrica de priorizados Técnica
on:
  push:
    branches: [fix/rescate-constructor-v2-reglas-20261119]
    paths:
      - 'scripts/inspeccionar-pdf-tecnica.py'
      - 'scripts/reconstruir-base-tecnica.py'
      - '.github/workflows/reconstruir-base-tecnica.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosticar-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar PyMuPDF
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Atomizar y consolidar las 26 especialidades desde PDF oficiales
        run: |
          python scripts/reconstruir-base-tecnica.py --jobs 5
      - name: Conservar base curricular reconstruida e incidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-tecnica-26-especialidades
          path: data/tecnica/base-curricular
          if-no-files-found: warn
          retention-days: 14
