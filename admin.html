<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Plataforma PCI</title><style>
:root{--ink:#15374a;--muted:#6a7b84;--line:#d6e2e5;--mint:#83ded3;--bg:#f3f7f7;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.top{display:flex;align-items:center;gap:16px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}.top img{width:260px;height:56px;object-fit:contain;object-position:left}.top h1{margin:0 auto 0 0;font-size:1.15rem}.button{padding:9px 12px;border:0;border-radius:10px;background:#e8eff1;color:var(--ink);font:850 .82rem inherit;cursor:pointer;text-decoration:none}.button.primary{background:var(--ink);color:#fff}.button.accent{background:var(--mint)}.shell{width:min(1320px,100%);margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}.stat strong{display:block;font-size:1.8rem}.stat span{color:var(--muted);font-size:.8rem;font-weight:800}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tools input,.tools select{padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.tools input{min-width:280px;flex:1}.wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:11px 12px;border-bottom:1px solid #e6ecee;text-align:left;vertical-align:middle}th{position:sticky;top:0;background:#f7fafb;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}td{font-size:.85rem}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:900}.muted{color:var(--muted)}.actions{display:flex;gap:6px}.msg{padding:12px;border-radius:12px;background:#fff5e8;color:#765b1f;font-size:.84rem;font-weight:800;margin:14px 0}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.top img{width:190px}.top h1{display:none}.shell{padding:14px}}</style></head><body>
<header class="top"><img src="logo-oficial-v2.svg" alt="Escuela de Maestros"><h1>Administración Plataforma PCI</h1><a class="button" href="access.html">Salir</a></header><main class="shell"><div class="stats"><div class="stat"><strong id="total">—</strong><span>Escuelas</span></div><div class="stat"><strong id="active">—</strong><span>Activas</span></div><div class="stat"><strong id="started">—</strong><span>PCI iniciados</span></div><div class="stat"><strong id="online">—</strong><span>Usuarios recientes</span></div></div><div class="tools"><input id="search" type="search" placeholder="Buscar por escuela, CUE o mail"><select id="year"><option value="">Todos los años</option></select><select id="status"><option value="">Todos los estados</option><option value="active">Activa</option><option value="inactive">Inactiva</option></select></div><div id="message" class="msg">Cargando información administrativa…</div><div class="wrap"><table><thead><tr><th>Escuela</th><th>CUE</th><th>Año</th><th>Clave edición</th><th>Estado</th><th>Última edición</th><th>Último usuario</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
let rows=[];const body=document.getElementById('rows'),message=document.getElementById('message');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}async function load(){try{const r=await fetch('/api/pci/admin/schools',{credentials:'include'});if(!r.ok)throw new Error('No se pudo consultar el tablero administrativo.');rows=await r.json();message.hidden=true;hydrateYears();render();}catch(e){if(location.hostname.endsWith('github.io')){const r=await fetch('schools-public.json?v=1');const d=await r.json();rows=d.schools.map(s=>({...s,status:'pending',edit_code:null,last_edit:null,last_user:null}));message.textContent='Vista de prueba: se muestran las escuelas del catálogo. Las claves, reseteos y estados reales aparecen únicamente con el backend administrativo conectado.';hydrateYears();render();}else message.textContent=e.message;}}
function hydrateYears(){const years=[...new Set(rows.map(r=>r.year).filter(Boolean))].sort((a,b)=>b-a);document.getElementById('year').innerHTML='<option value="">Todos los años</option>'+years.map(y=>`<option>${esc(y)}</option>`).join('')}
function render(){const q=document.getElementById('search').value.toLowerCase(),year=document.getElementById('year').value,status=document.getElementById('status').value;const filtered=rows.filter(r=>(!q||`${r.name} ${r.cue} ${r.mail}`.toLowerCase().includes(q))&&(!year||String(r.year)===year)&&(!status||r.status===status));body.innerHTML=filtered.map(r=>`<tr><td><strong>${esc(r.name)}</strong><br><span class="muted">${esc(r.mail||'')}</span></td><td>${esc(r.cue||'—')}</td><td>${esc(r.year||'—')}</td><td class="code">${r.edit_code?esc(r.edit_code):'••••••••'}</td><td>${esc(r.status||'Pendiente')}</td><td>${esc(r.last_edit||'—')}</td><td>${esc(r.last_user||'—')}</td><td><div class="actions"><button class="button" onclick="copyCode(${r.id})">Copiar</button><button class="button accent" onclick="resetCode(${r.id})">Resetear</button><a class="button primary" href="escuela.html?school=${encodeURIComponent(r.id)}">Abrir</a></div></td></tr>`).join('');document.getElementById('total').textContent=rows.length;document.getElementById('active').textContent=rows.filter(r=>r.status==='active').length;document.getElementById('started').textContent=rows.filter(r=>r.started).length;document.getElementById('online').textContent=rows.filter(r=>r.recent_user).length;}
async function copyCode(id){const r=rows.find(x=>x.id===id);if(r?.edit_code){await navigator.clipboard.writeText(r.edit_code);return}alert('La clave solo está disponible en el backend administrativo seguro.')}async function resetCode(id){if(!confirm('¿Generar una nueva clave PCI-####? La anterior dejará de funcionar.'))return;try{const res=await fetch(`/api/pci/admin/schools/${id}/reset-code`,{method:'POST',credentials:'include'});if(!res.ok)throw new Error('No se pudo resetear la clave.');const data=await res.json();const r=rows.find(x=>x.id===id);if(r)r.edit_code=data.edit_code;render();}catch(e){alert(location.hostname.endsWith('github.io')?'El reseteo requiere el backend administrativo del servidor institucional.':e.message)}}document.getElementById('search').addEventListener('input',render);document.getElementById('year').addEventListener('change',render);document.getElementById('status').addEventListener('change',render);load();
</script></body></html>
