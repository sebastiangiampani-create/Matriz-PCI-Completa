<body>
<iframe id="demoFrame" src="portal-demo-seguro.html?v=20260821-4" title="Secundaria PCI"></iframe>
<script>
const frame=document.getElementById('demoFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const previous=doc.getElementById('portalDemoFixes');
    if(previous) previous.remove();
    const script=doc.createElement('script');
    script.id='portalDemoFixes';
    script.src='portal-demo-fixes.js?v=20260821-2';
    doc.body.appendChild(script);
  }catch(error){console.error(error);}
});
