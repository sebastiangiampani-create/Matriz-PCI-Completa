<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coordinación · PCI</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f7;color:#15374a;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:18px 5vw;background:#fff;border-bottom:1px solid #d6e2e5}header img{height:42px;width:auto;max-width:75vw;object-fit:contain;object-position:left}.shell{width:min(1100px,92vw);margin:40px auto}.card{background:#fff;border:1px solid #d6e2e5;border-radius:22px;padding:22px}h1{font-size:clamp(2.2rem,5vw,4rem);margin:.2em 0}.lead{color:#6a7b84}.login{max-width:560px}label{display:grid;gap:6px;font-weight:800}input{width:100%;padding:12px;border:1px solid #d6e2e5;border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;background:#15374a;color:#fff}.actions{display:flex;gap:10px;margin-top:14px}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.search{max-width:480px}.list{display:grid;gap:10px}.school{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px;border:1px solid #d6e2e5;border-radius:14px;background:#fff}.school strong,.school small{display:block}.school small{color:#6a7b84;margin-top:4px}.msg{color:#b3314d;font-weight:800;margin-top:10px}@media(max-width:700px){.school,.toolbar{align-items:stretch;flex-direction:column}.btn{width:100%}}</style></head><body><header><img src="assets/em-logo-header.svg?v=20260902" alt="Escuela de Maestros"></header><main class="shell"><section id="login" class="card login"><p class="lead">Acceso institucional</p><h1>Coordinación</h1><p class="lead">Permite visualizar y editar los PCI de todas las escuelas. No muestra ni administra las claves de las escuelas.</p><form id="form"><label>Clave de Coordinación<input id="pass" type="password" required autocomplete="current-password"></label><div class="actions"><button class="btn">Ingresar</button><a href="./" style="padding:11px 15px;color:#15374a">Volver</a></div><div id="msg" class="msg"></div></form></section><section id="dash" class="hidden"><div class="toolbar"><div><h1>PCI · Coordinación</h1><div class="lead">Rol: Coordinación · acceso de edición a todas las escuelas</div></div><button id="logout" class="btn">Cerrar sesión</button></div><div class="card"><input id="search" class="search" type="search" placeholder="Buscar escuela o CUE"><p id="count" class="lead"></p><div id="list" class="list"></div></div></section></main><script>const API='https://agmebsotbuurbnldxewf.supabase.co/functions/v1/pci-access';let session=null,schools=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo completar la operación');return d}function ordered(a){return [...a].sort((x,y)=>String(x.name||'').localeCompare(String(y.name||''),'es',{sensitivity:'base',numeric:true}))}function render(){const q=norm($('search').value);const rows=schools.filter(s=>norm(`${s.name} ${s.cue}`).includes(q));$('count').textContent=`${rows.length} escuelas`;$('list').innerHTML=rows.map(s=>`<div class="school"><div><strong>${esc(s.name)}</strong><small>${esc(s.cue||'Sin CUE')}</small></div><button class="btn" data-open="${s.school_id}">Abrir y editar PCI</button></div>`).join('')}async function load(){const d=await call({action:'list-schools',token:session.token});schools=ordered(d.schools||[]);render()}$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Verificando…';try{session=await call({action:'coord-login',password:$('pass').value});sessionStorage.setItem('pci_access_session',JSON.stringify(session));$('login').classList.add('hidden');$('dash').classList.remove('hidden');await load()}catch(err){$('msg').textContent=err.message}};$('search').oninput=render;$('list').onclick=e=>{const b=e.target.closest('[data-open]');if(!b)return;location.href=`escuela-online.html?school=${b.dataset.open}`};$('logout').onclick=()=>{sessionStorage.removeItem('pci_access_session');location.reload()};</script></body></html>
