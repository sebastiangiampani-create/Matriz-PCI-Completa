name: Integrar V2 original en portal real de escuelas
on:
  push:
    branches:
      - fix/integrar-v2-real-en-portal-20261120
    paths:
      - pci-orientaciones.html
      - src/orientaciones-online.mjs
      - src/v2-integrated-portal.css
      - revision-v2-embed.html
      - tests/v2-integrado-portal-browser.mjs
      - tests/multipci-portal-browser.mjs
      - tests/pci-nueva-escuela-browser.mjs
      - tests/vinculos-historicos-browser.mjs
      - .github/workflows/integrar-v2-real-portal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrar-v2-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que el código original V2 no cambió
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object vendor/pci-sec-aprende-v2/app-core.html)" = a318ca1730857d0394113f5f079387183f348048
          test "$(git hash-object vendor/pci-sec-aprende-v2/src/v19-map.js)" = e1a72cc683e875a414c631c9727ce1a725378df6
          node --check src/orientaciones-online.mjs
          node --check tests/v2-integrado-portal-browser.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador real
        run: |
          npm install --no-save playwright@1.55.0
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Abrir PCI real, usar V2 original, guardar, cambiar y reabrir
        run: |
          mkdir -p test-artifacts/v2-original
          node tests/v2-integrado-portal-browser.mjs
          node tests/multipci-portal-browser.mjs
          node tests/pci-nueva-escuela-browser.mjs
          node tests/vinculos-historicos-browser.mjs
      - name: Capturas de evidencia, sin desplegar producción
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-original-integrado-portal
          path: test-artifacts/v2-original
          retention-days: 7
