name: Validación específica PCI Media y Técnica sin datos reales

on:
  pull_request:
    branches: [main]
    paths:
      - migration/multipci/**
      - src/multipci/**
      - supabase/functions/pci-access/pci-workspace-handlers.mjs
      - src/orientaciones-release-core.mjs
      - tests/multipci/**
      - tests/orientaciones-release.test.mjs
      - src/tecnica/**
      - pci-tecnica-pautas.html
      - tests/pautas-pci-20261005.test.mjs
      - .github/workflows/validar-media-tecnica.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-y-permisos:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-sin-datos-reales
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-sin-datos-reales
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seguridad de las rutas, ramas y planes
        run: node --test tests/multipci/api.test.mjs tests/orientaciones-release.test.mjs tests/edge-package.test.mjs tests/pautas-pci-20261005.test.mjs
      - name: Estructura de prueba totalmente ficticia
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE TABLE public.pci_proposals (
            school_id integer PRIMARY KEY,
            data jsonb NOT NULL,
            edit_code text,
            primary_code text,
            updated_at timestamptz NOT NULL DEFAULT clock_timestamp()
          );
          SQL
      - name: Crear las dos ramas y conservar hash de los documentos históricos
        run: |
          psql -v ON_ERROR_STOP=1 -f migration/multipci/001_additive_school_pcis.sql
          psql -v ON_ERROR_STOP=1 -f tests/multipci/contrato-postgres.sql
